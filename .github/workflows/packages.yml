name: Release packages
on:
  workflow_dispatch:
    inputs:
      mac_only:
        description: Build only the universal DMG
        type: boolean
        default: false
      android_only:
        description: Build only the Android APK
        type: boolean
        default: false
      source_ref:
        description: Optional source commit for a packaging retry
        type: string
        required: false
permissions:
  contents: read
env:
  CARGO_PROFILE_RELEASE_LTO: 'false'
  CARGO_PROFILE_RELEASE_CODEGEN_UNITS: '16'
  CARGO_INCREMENTAL: '0'
jobs:
  linux:
    if: ${{ !inputs.mac_only && !inputs.android_only }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: git rev-parse HEAD
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y libasound2-dev libfontconfig1-dev libfreetype-dev libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev libx11-dev libx11-xcb-dev libxcursor-dev libxi-dev libxrandr-dev libclang-dev cmake
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build --release --locked && tools/appimage.sh
      - uses: actions/upload-artifact@v7
        with:
          name: linux-${{ matrix.arch }}
          path: target/appimage/yamusic-rs-${{ matrix.arch }}.AppImage
          if-no-files-found: error
  windows:
    if: ${{ !inputs.mac_only && !inputs.android_only }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - shell: pwsh
        run: |
          python tools/android-speech-model.py "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "YM_WINDOWS_SPEECH_MODEL=$env:RUNNER_TEMP/ggml-small-q5_1.bin" >> $env:GITHUB_ENV
      - run: cargo build --release --locked
      - shell: pwsh
        run: |
          mkdir package, dist
          Copy-Item target/release/yamusic-rs.exe package/
          Copy-Item LICENSE, models/*-LICENSE package/
          Compress-Archive -Path package/* -DestinationPath dist/ym-uncensored-windows-x64.zip
          Copy-Item target/release/yamusic-rs.exe dist/
      - uses: actions/upload-artifact@v7
        with:
          name: windows-x64
          path: dist/*
          if-no-files-found: error
  macos:
    if: ${{ !inputs.android_only }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-apple-darwin,aarch64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - run: tools/macos-app.sh --universal --dmg
      - run: |
          codesign --verify --deep --strict 'target/macos/YM UNCENSORED.app'
          archs=$(lipo -archs 'target/macos/YM UNCENSORED.app/Contents/MacOS/yamusic-rs')
          echo "DMG architectures: $archs"
          case "$archs" in "x86_64 arm64"|"arm64 x86_64") ;; *) exit 1 ;; esac
          test ! -e 'target/macos/YM UNCENSORED.app/Contents/Resources/originals.json'
      - uses: actions/upload-artifact@v7
        with:
          name: macos-universal
          path: target/macos/ym-uncensored-*-macos.dmg
          if-no-files-found: error
  android:
    if: ${{ !inputs.mac_only }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.source_ref || github.sha }}
      - run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: android
      # CMake caches absolute compiler paths, which can change between NDK runners.
      - working-directory: android
        run: cargo clean -p whisper-rs-sys --release --target aarch64-linux-android
      - run: |
          sudo apt-get update -qq
          sudo apt-get install -y libclang-dev cmake
          mkdir -p "$RUNNER_TEMP/ym-sdk"
          cp -r "$ANDROID_HOME/licenses" "$RUNNER_TEMP/ym-sdk/"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$RUNNER_TEMP/ym-sdk" 'platforms;android-35' 'build-tools;36.0.0' 'ndk;28.2.13676358'
      - run: ANDROID_HOME="$RUNNER_TEMP/ym-sdk" JAVA_HOME="$JAVA_HOME_17_X64" APK_UNSIGNED_ONLY=1 tools/apk.sh
      - uses: actions/upload-artifact@v7
        with:
          name: android-arm64-unsigned
          path: target/apk/aligned.apk
          if-no-files-found: error
