name: Ошибка
description: Что-то не работает или работает не так, как в официальном приложении
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Версия RS
      description: «Настройки → О приложении»
      placeholder: "1.0.0"
    validations:
      required: true
  - type: input
    id: windows
    attributes:
      label: Windows
      placeholder: "Windows 11 24H2"
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Что случилось
      description: Что вы делали, что ожидали увидеть и что получилось. Скриншоты сюда же.
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Лог
      description: >
        Последние строки `%APPDATA%\yamusic-rs\log.txt`. Токена там нет, но числовой id
        аккаунта в адресах можно заменить на ***.
      render: text
